<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Name Generator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Akan Name Generator</h1>

    <p>
        Enter your birth date and gender to discover your Akan name.
    </p>
    <!--preventing the web browser from stoppping my code-->
    <form id ="nameform">

    <div class="form-group">
    <label for="day">Day</label>
    <input type="number" id="day" placeholder="Enter day" min="1" max="31">
</div>

<div class="form-group">
    <label for="month">Month</label>
    <select id="month">
        <option value="">Select Month</option>
        <option value="1">January</option>
        <option value="2">February</option>
        <option value="3">March</option>
        <option value="4">April</option>
        <option value="5">May</option>
        <option value="6">June</option>
        <option value="7">July</option>
        <option value="8">August</option>
        <option value="9">September</option>
        <option value="10">October</option>
        <option value="11">November</option>
        <option value="12">December</option>
    </select>
</div>

<div class="form-group">
    <label for="year">Year</label>
    <input type="number" id="year" placeholder="Enter year">
</div>

<div class="form-group">
    <label for="gender">Gender</label>
    <select id="gender">
        <option value="">Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
    </select>
</div>

        <button type="submit">Generate Akan Name</button>

    </form>

    <div id="result">
    <h2>Result</h2>
    <p>Your Akan name will appear here.</p>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
